let ordered=[];for(const f of faces){let n=f.n;if(n[0]*sa*ce+n[1]*se+n[2]*ca*ce<=0)continue;ordered.push([transform(f.x+.5,f.y+.5,f.z+.5)[2],f]);}ordered.sort((a,b)=>a[0]-b[0]);ctx.lineWidth=.28;
for(const [,f]of ordered){ctx.beginPath();f.pts.forEach((p,i)=>{let q=transform(f.x+p[0],f.y+p[1],f.z+p[2]);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});ctx.closePath();let shade=f.n[1]>.5?1.15:f.n[0]!==0?.78:.92;ctx.fillStyle=rgb(f.color,shade);ctx.fill();ctx.strokeStyle='#0b0e152c';ctx.stroke();}
}
function preset(view){if(view==='front'){angle=2.55;elevation=.52;ceiling=51;}if(view==='rear'){angle=-.65;elevation=.60;ceiling=51;}if(view==='inside'){angle=2.55;elevation=.83;ceiling=29;}if(view==='top'){angle=0;elevation=1.50;ceiling=25;}cut.value=ceiling;document.getElementById('height').textContent=ceiling;mesh();}
cut.oninput=()=>{ceiling=+cut.value;document.getElementById('height').textContent=ceiling;mesh();};zoom.oninput=()=>dirty=true;canvas.onpointerdown=e=>{drag=true;oldX=e.clientX;oldY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;angle+=(e.clientX-oldX)*.008;elevation=Math.max(.12,Math.min(1.52,elevation+(e.clientY-oldY)*.006));oldX=e.clientX;oldY=e.clientY;dirty=true;};canvas.onwheel=e=>{e.preventDefault();zoom.value=Math.max(4,Math.min(21,+zoom.value-e.deltaY*.005));dirty=true;};onresize=()=>dirty=true;preset('front');render();
</script></html>
